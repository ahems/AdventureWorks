name: Deploy demo with service principal (azd up)

on:
  workflow_dispatch:
    inputs:
      environment_name:
        description: "Optional new azd environment name (defaults to adventureworks001–999)"
        required: false
        type: string
      azure_location:
        description: "Azure region for main resources"
        required: false
        default: "eastus2"
        type: string
      foundry_location:
        description: "Azure region for Microsoft Foundry"
        required: false
        default: "swedencentral"
        type: string
      validate_auth_infra:
        description: "After readiness, run the read-only authentication infrastructure assurance as this service principal"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Select environment name
    runs-on: ubuntu-latest
    outputs:
      environment_name: ${{ steps.select_name.outputs.environment_name }}
    steps:
      - name: Select environment name
        id: select_name
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment_name }}
        run: |
          set -euo pipefail
          if [[ -z "$ENVIRONMENT_NAME" ]]; then
            if ! NUMBER=$(shuf -i 1-999 -n 1); then
              echo "Could not generate an environment name." >&2
              exit 1
            fi
            printf -v ENVIRONMENT_NAME 'adventureworks%03d' "$NUMBER"
          fi
          if [[ ! "$ENVIRONMENT_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{1,39}$ ]]; then
            echo "Environment name must be 2-40 letters, numbers, or hyphens and start with a letter or number." >&2
            exit 1
          fi
          echo "Selected azd environment: $ENVIRONMENT_NAME"
          printf 'environment_name=%s\n' "$ENVIRONMENT_NAME" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy disposable demo
    needs: prepare
    runs-on: ubuntu-latest
    environment: adventureworks-demo
    timeout-minutes: 180
    concurrency:
      group: azd-up-${{ needs.prepare.outputs.environment_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository and Git LFS assets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true

      - name: Validate deployment inputs
        env:
          AZURE_LOCATION: ${{ inputs.azure_location }}
          FOUNDRY_LOCATION: ${{ inputs.foundry_location }}
          DEPLOYER_CLIENT_ID: ${{ vars.DEPLOYER_CLIENT_ID }}
          DEPLOYER_OBJECT_ID: ${{ vars.DEPLOYER_OBJECT_ID }}
          DEPLOYER_TENANT_ID: ${{ vars.DEPLOYER_TENANT_ID }}
          DEPLOYER_SUBSCRIPTION_ID: ${{ vars.DEPLOYER_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$DEPLOYER_CLIENT_ID" || -z "$DEPLOYER_OBJECT_ID" ||
                -z "$DEPLOYER_TENANT_ID" || -z "$DEPLOYER_SUBSCRIPTION_ID" ]]; then
            echo "GitHub Environment variables DEPLOYER_CLIENT_ID, DEPLOYER_OBJECT_ID, DEPLOYER_TENANT_ID, and DEPLOYER_SUBSCRIPTION_ID are required." >&2
            exit 1
          fi
          for value in "$DEPLOYER_CLIENT_ID" "$DEPLOYER_OBJECT_ID" "$DEPLOYER_TENANT_ID" "$DEPLOYER_SUBSCRIPTION_ID"; do
            if [[ ! "$value" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
              echo "Each DEPLOYER_* ID must be a valid GUID." >&2
              exit 1
            fi
          done
          if [[ ! "$AZURE_LOCATION" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "AZURE_LOCATION must contain only letters, numbers, and hyphens." >&2
            exit 1
          fi
          if [[ ! "$FOUNDRY_LOCATION" =~ ^[a-zA-Z0-9-]+$ ]]; then
            echo "FOUNDRY_LOCATION must contain only letters, numbers, and hyphens." >&2
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Set up Azure Developer CLI
        uses: Azure/setup-azd@0b7e3a35ab00f2eee7080c845eb39c3f0ebfa553 # v2.4.0
        with:
          version: 1.39.1

      - name: Verify host tools
        run: |
          set -euo pipefail
          for tool in az azd pwsh python3 jq git-lfs curl; do
            command -v "$tool" >/dev/null || {
              echo "Required deployment tool is missing: $tool" >&2
              exit 1
            }
          done
          az version --output json >/dev/null
          azd version
          pwsh --version
          python3 --version
          jq --version
          git lfs version

      - name: Log in to Azure CLI with GitHub OIDC
        uses: Azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          auth-type: SERVICE_PRINCIPAL
          client-id: ${{ vars.DEPLOYER_CLIENT_ID }}
          tenant-id: ${{ vars.DEPLOYER_TENANT_ID }}
          subscription-id: ${{ vars.DEPLOYER_SUBSCRIPTION_ID }}

      - name: Verify deployment service principal
        env:
          DEPLOYER_CLIENT_ID: ${{ vars.DEPLOYER_CLIENT_ID }}
          DEPLOYER_OBJECT_ID: ${{ vars.DEPLOYER_OBJECT_ID }}
        run: |
          set -euo pipefail
          if ! PRINCIPAL=$(az rest --method get \
            --url "https://graph.microsoft.com/v1.0/servicePrincipals/$DEPLOYER_OBJECT_ID?\$select=id,appId,servicePrincipalType" \
            --output json); then
            echo "Could not read the deployment service principal from Microsoft Graph." >&2
            exit 1
          fi
          if ! jq -se --arg object_id "$DEPLOYER_OBJECT_ID" --arg client_id "$DEPLOYER_CLIENT_ID" '
            length == 1 and (.[0] |
              type == "object" and .servicePrincipalType == "Application" and
              (.id | type == "string") and (.appId | type == "string") and
              ((.id | ascii_downcase) == ($object_id | ascii_downcase)) and
              ((.appId | ascii_downcase) == ($client_id | ascii_downcase)))
          ' <<< "$PRINCIPAL" >/dev/null; then
            echo "Deployment requires an application service principal matching DEPLOYER_CLIENT_ID and DEPLOYER_OBJECT_ID." >&2
            exit 1
          fi

      - name: Log in to azd with GitHub OIDC
        env:
          DEPLOYER_CLIENT_ID: ${{ vars.DEPLOYER_CLIENT_ID }}
          DEPLOYER_TENANT_ID: ${{ vars.DEPLOYER_TENANT_ID }}
          DEPLOYER_SUBSCRIPTION_ID: ${{ vars.DEPLOYER_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          azd auth login \
            --client-id "$DEPLOYER_CLIENT_ID" \
            --tenant-id "$DEPLOYER_TENANT_ID" \
            --federated-credential-provider github
          test "$(az account show --query id --output tsv)" = "$DEPLOYER_SUBSCRIPTION_ID"
          azd auth login --check-status

      - name: Configure azd environment
        env:
          ENVIRONMENT_NAME: ${{ needs.prepare.outputs.environment_name }}
          AZURE_LOCATION: ${{ inputs.azure_location }}
          FOUNDRY_LOCATION: ${{ inputs.foundry_location }}
          DEPLOYER_CLIENT_ID: ${{ vars.DEPLOYER_CLIENT_ID }}
          DEPLOYER_OBJECT_ID: ${{ vars.DEPLOYER_OBJECT_ID }}
          DEPLOYER_TENANT_ID: ${{ vars.DEPLOYER_TENANT_ID }}
          DEPLOYER_SUBSCRIPTION_ID: ${{ vars.DEPLOYER_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          RESOURCE_GROUP="rg-$ENVIRONMENT_NAME"
          if [[ "$(az group exists --name "$RESOURCE_GROUP" --subscription "$DEPLOYER_SUBSCRIPTION_ID")" == true ]]; then
            echo "Resource group $RESOURCE_GROUP already exists. This workflow only creates fresh demo environments; choose a new environment name." >&2
            exit 1
          fi
          azd env new "$ENVIRONMENT_NAME" --subscription "$DEPLOYER_SUBSCRIPTION_ID" --no-prompt
          azd env set AZURE_ENV_NAME "$ENVIRONMENT_NAME" --no-prompt
          azd env set AZURE_SUBSCRIPTION_ID "$DEPLOYER_SUBSCRIPTION_ID" --no-prompt
          azd env set AZURE_RESOURCE_GROUP "rg-$ENVIRONMENT_NAME" --no-prompt
          azd env set AZURE_LOCATION "$AZURE_LOCATION" --no-prompt
          azd env set FOUNDRY_LOCATION "$FOUNDRY_LOCATION" --no-prompt
          azd env set TENANT_ID "$DEPLOYER_TENANT_ID" --no-prompt
          azd env set NAME "$DEPLOYER_CLIENT_ID" --no-prompt
          azd env set OBJECT_ID "$DEPLOYER_OBJECT_ID" --no-prompt
          azd env set DEPLOYER_PRINCIPAL_TYPE ServicePrincipal --no-prompt
          azd env set SQL_DATABASE_NAME AdventureWorks --no-prompt

      - name: Provision and deploy with azd
        id: azd_up
        run: azd up --no-prompt

      - name: Wait for this run's seed execution
        env:
          RESOURCE_GROUP: ${{ needs.prepare.outputs.environment_name }}
          SEED_EXECUTION_NAME: ${{ steps.azd_up.outputs.seed_execution_name }}
        run: |
          set -euo pipefail
          RESOURCE_GROUP="rg-$RESOURCE_GROUP"
          JOB_NAME=$(azd env get-value SERVICE_SEED_JOB_NAME --no-prompt)
          if [[ -z "$SEED_EXECUTION_NAME" || -z "$JOB_NAME" ]]; then
            echo "This run did not publish its seed execution name; refusing to report demo readiness." >&2
            exit 1
          fi

          for attempt in $(seq 1 180); do
            STATUS=$(az containerapp job execution show \
              --name "$JOB_NAME" \
              --job-execution-name "$SEED_EXECUTION_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.status --output tsv)
            echo "Seed execution $SEED_EXECUTION_NAME status: $STATUS"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded|Canceled|Cancelled)
                echo "Seed execution $SEED_EXECUTION_NAME ended with status $STATUS." >&2
                exit 1
                ;;
            esac
            if [[ "$attempt" -eq 180 ]]; then
              echo "Timed out waiting for seed execution $SEED_EXECUTION_NAME." >&2
              exit 1
            fi
            sleep 30
          done

      - name: Verify service readiness and network cleanup
        env:
          RESOURCE_GROUP: ${{ needs.prepare.outputs.environment_name }}
          SEED_EXECUTION_NAME: ${{ steps.azd_up.outputs.seed_execution_name }}
        run: |
          set -euo pipefail
          RESOURCE_GROUP="rg-$RESOURCE_GROUP"
          APP_URL=$(azd env get-value APP_URL --no-prompt)
          APP_ADMIN_URL=$(azd env get-value APP_ADMIN_URL --no-prompt)
          APP_MANUFACTURING_URL=$(azd env get-value APP_MANUFACTURING_URL --no-prompt)
          API_FUNCTIONS_URL=$(azd env get-value API_FUNCTIONS_URL --no-prompt)
          API_MCP_URL=$(azd env get-value API_MCP_URL --no-prompt)
          SQL_SERVER_NAME=$(azd env get-value SQL_SERVER_NAME --no-prompt)
          KEY_VAULT_NAME=$(azd env get-value MCP_SIGNING_KEY_VAULT_NAME --no-prompt)

          for attempt in $(seq 1 10); do
            if curl --silent --show-error --fail --max-time 60 "$APP_URL" --output /dev/null; then
              break
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "Storefront did not become available after 10 attempts." >&2
              exit 1
            fi
            echo "Storefront is still starting; retrying in 30 seconds."
            sleep 30
          done
          for attempt in $(seq 1 10); do
            if API_FUNCTIONS_URL="$API_FUNCTIONS_URL" API_MCP_URL="$API_MCP_URL" \
              bash tests/scripts/test-health-diagnostics.sh; then
              break
            fi
            if [[ "$attempt" -eq 10 ]]; then
              echo "Functions and MCP readiness checks did not pass after 10 attempts." >&2
              exit 1
            fi
            echo "Application dependencies are still starting; retrying readiness in 30 seconds."
            sleep 30
          done

          SQL_NETWORK_ACCESS=$(az sql server show \
            --name "$SQL_SERVER_NAME" --resource-group "$RESOURCE_GROUP" \
            --query publicNetworkAccess --output tsv)
          if [[ "$SQL_NETWORK_ACCESS" != Disabled ]]; then
            echo "SQL public network access is '$SQL_NETWORK_ACCESS', expected Disabled." >&2
            exit 1
          fi
          SQL_FIREWALL_RULES=$(az sql server firewall-rule list \
            --server "$SQL_SERVER_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "[].name" --output tsv)
          if grep -Fxq AllowClient <<< "$SQL_FIREWALL_RULES"; then
            echo "Temporary SQL firewall rule AllowClient still exists." >&2
            exit 1
          fi

          RUNNER_IP=$(curl -4fsS --connect-timeout 5 --max-time 10 https://api.ipify.org)
          KEY_VAULT_IP_RULES=$(az keyvault show \
            --name "$KEY_VAULT_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.networkAcls.ipRules[].value" --output tsv)
          if grep -Fq "$RUNNER_IP" <<< "$KEY_VAULT_IP_RULES"; then
            echo "Temporary GitHub runner IP rule remains on Key Vault." >&2
            exit 1
          fi

          {
            echo "## AdventureWorks demo deployment"
            echo
            echo "- Resource group: \`$RESOURCE_GROUP\`"
            echo "- Seed execution: \`$SEED_EXECUTION_NAME\` — Succeeded"
            echo "- [Storefront]($APP_URL)"
            echo "- [Admin]($APP_ADMIN_URL)"
            echo "- [Manufacturing]($APP_MANUFACTURING_URL)"
            echo "- Functions and MCP readiness: passed"
            echo "- SQL and Key Vault temporary network-rule cleanup: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      # Users may hold no Azure permissions in this path, so the deployer service principal runs the read-only
      # --infra assurance. It makes no Azure changes and never signs in as an application user.
      - name: Validate authentication infrastructure (read-only)
        if: ${{ inputs.validate_auth_infra }}
        env:
          ENVIRONMENT_NAME: ${{ needs.prepare.outputs.environment_name }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/auth-venv"
          "$RUNNER_TEMP/auth-venv/bin/pip" install --quiet -r tests/auth/container/requirements.txt
          export PATH="$RUNNER_TEMP/auth-venv/bin:$PATH"
          set +e
          bash tests/scripts/validate-auth.sh --infra --environment "$ENVIRONMENT_NAME" \
            --output .auth-results/ci-infra
          result=$?
          set -e
          if [[ ! -f .auth-results/ci-infra/report.json ]]; then
            echo "Authentication assurance did not produce a report." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from collections import Counter
          with open(".auth-results/ci-infra/report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)
          counts = Counter(item["status"] for item in report["checks"])
          lines = ["# Authentication infrastructure assurance", "",
                   f"Outcome: **{report['outcome']}**", "",
                   "| Status | Count |", "| --- | ---: |"]
          for status in ["PASS", "ACCEPTED_EXCEPTION", "BLOCKED", "FAIL"]:
              lines.append(f"| {status} | {counts.get(status, 0)} |")
          with open(".auth-results/ci-infra/summary.md", "w", encoding="utf-8") as summary_file:
              summary_file.write("\n".join(lines) + "\n")
          PY
          cat .auth-results/ci-infra/summary.md >> "$GITHUB_STEP_SUMMARY"
          # Exit code 2 means only BLOCKED items remain (for example, private data-plane checks).
          if [[ "$result" != "0" && "$result" != "2" ]]; then
            exit "$result"
          fi

      - name: Upload authentication infrastructure report
        if: ${{ always() && inputs.validate_auth_infra }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auth-infra-${{ needs.prepare.outputs.environment_name }}
          # Keep check details and resource inventory out of artifacts readable by repository readers.
          path: .auth-results/ci-infra/summary.md
          if-no-files-found: warn
          retention-days: 14
