server {
    listen 80;
    server_name _;

    # MCP proxy server (port 6277) — must come before the root catch-all
    # Strips /proxy prefix before forwarding to the proxy process
    location /proxy/ {
        proxy_pass http://127.0.0.1:6277/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        # Required for SSE (Server-Sent Events)
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # Inspector UI (port 6274)
    location / {
        proxy_pass http://127.0.0.1:6274/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
