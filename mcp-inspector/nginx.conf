server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:6274/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 310s;
        proxy_buffering off;
        proxy_cache off;
    }
}
