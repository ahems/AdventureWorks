# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.4'
name: manufacturing-agent
services:
    manufacturing-agent:
        project: src/mcp-tools
        host: azure.ai.agent
        language: csharp
        codeConfiguration:
            entryPoint: mcp-tools.dll
            runtime: dotnet_10
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            Autonomous manufacturing and supply chain agent. Triggered when new sales orders are placed. Analyses inventory levels, assesses manufacturing feasibility, and takes action based on the configured autonomy mode (ReadOnly / ProposePending / FullyAutonomous).
        displayName: Manufacturing Agent
        environmentVariables:
            - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
              value: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            - name: MCP_SERVICE_URL
              value: ${MCP_SERVICE_URL}
        kind: hosted
        metadata:
            tags:
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Agent Framework
                - MCP
                - Manufacturing
        name: manufacturing-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
